schema_version: 1

context:
  version: "0.14.2"

package:
  name: git-pkgs-brief
  version: ${{ version }}

source:
  url: https://github.com/git-pkgs/brief/archive/v${{ version }}.tar.gz
  sha256: e01028fc5bc79a49b76b0804325ea5b12796c3275799f82b89e4cc0717bc3bb5

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - brief --version
      - brief --help
  - package_contents:
      bin:
        - brief
      strict: true

about:
  homepage: https://git-pkgs.dev
  summary: A single-binary CLI tool that detects a project's toolchain, configuration, and conventions
  description: |
    brief detects a software project's toolchain, configuration, and
    conventions, then outputs a structured report. It answers the bootstrap
    questions every AI coding agent, new contributor, and CI pipeline faces:
    what language is this, how do I install dependencies, how do I run the
    tests, what linter is configured. It does not score, grade, or judge --
    it reports facts.
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  repository: https://github.com/git-pkgs/brief

extra:
  recipe-maintainers:
    - pb01ka
